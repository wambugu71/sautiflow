name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # TWEAK 1: Tell the checkout action to pull your submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libcurl4-openssl-dev libnotify-dev

      - name: Install dependencies
        run: flutter pub get

      # TWEAK 2: Convert submodules to regular files so pub.dev accepts them
      - name: Prepare Submodules for Pub Publish
        run: |
          # 1. Un-track the submodules as Git links
          git rm --cached third_party/faad2 third_party/libsamplerate
          
          # 2. Delete their inner .git folders so they are just normal directories
          rm -rf third_party/faad2/.git
          rm -rf third_party/libsamplerate/.git
          
          # 3. Add the raw files to the current runner's Git index
          git add third_party/faad2 third_party/libsamplerate
          
          # 4. Commit them so `dart pub publish` sees them natively
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Temporary commit to bundle third_party files for pub.dev"

      # TWEAK 3: Publish (will now include the C++ files!)
      - name: Publish package
        run: dart pub publish --force

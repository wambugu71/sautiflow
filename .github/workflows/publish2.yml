name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # TWEAK 1: Tell the checkout action to pull your submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Submodules for Pub Publish
        run: |
          # 1. Un-track the submodules as Git links
          git rm --cached -f third_party/faad2 third_party/libsamplerate || true
          
          # 2. Delete their inner .git folders/files so they are treated as normal directories
          rm -rf third_party/faad2/.git
          rm -rf third_party/libsamplerate/.git
          find third_party -name ".git*" -exec rm -rf {} + || true
          
          # 3. Add the files to git index
          git add third_party/faad2 third_party/libsamplerate
          
          # 4. Commit so `dart pub publish` treats them as normal files
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Temporary commit to bundle third_party files for pub.dev" || true

      - name: Publish package
        run: dart pub publish --force

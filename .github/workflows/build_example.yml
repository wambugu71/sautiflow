name: Build Example Releases

on:
    push:
        tags:
            - 'v*'
        branches:
            - main
            - master
            - alpha-experimental-release
    workflow_dispatch:

jobs:
    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - name: Install dependencies
              working-directory: ./example
              run: flutter pub get

            - name: Build Android APK
              working-directory: ./example
              run: flutter build apk --release --target-platform android-arm,android-arm64

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: android-apk
                  path: example/build/app/outputs/flutter-apk/app-release.apk

    build-windows:
        name: Build Windows
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - name: Install dependencies
              working-directory: .\example
              run: flutter pub get

            - name: Build Windows
              working-directory: .\example
              run: flutter build windows --release

            - name: Compress Release
              working-directory: .\example\build\windows\x64\runner
              run: Compress-Archive -Path Release -DestinationPath Release.zip

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows-release
                  path: example\build\windows\x64\runner\Release.zip

    build-linux:
        name: Build Linux
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libcurl4-openssl-dev
            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - name: Install dependencies
              working-directory: ./example
              run: flutter pub get

            - name: Build Linux
              working-directory: ./example
              run: flutter build linux --release

            - name: Compress Release
              working-directory: ./example/build/linux/x64/release
              run: tar -czvf release.tar.gz bundle

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: linux-release
                  path: example/build/linux/x64/release/release.tar.gz

    build-macos:
        name: Build macOS
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - name: Install dependencies
              working-directory: ./example
              run: flutter pub get

            - name: Build macOS
              working-directory: ./example
              run: flutter build macos --release

            - name: Compress Release
              working-directory: ./example/build/macos/Build/Products/Release
              run: zip -r macos-release.zip . -i "*.app"

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macos-release
                  path: example/build/macos/Build/Products/Release/macos-release.zip

    build-ios:
        name: Build iOS
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"

            - name: Install dependencies
              working-directory: ./example
              run: flutter pub get

            - name: Build iOS
              working-directory: ./example
              run: flutter build ios --release --no-codesign

            - name: Compress Release
              working-directory: ./example/build/ios/iphoneos
              run: zip -r ios-release.zip Runner.app

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ios-release
                  path: example/build/ios/iphoneos/ios-release.zip

    create-release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: [build-android, build-windows, build-linux, build-macos, build-ios]
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Display structure of downloaded files
              run: ls -R artifacts

            - name: Release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      artifacts/android-apk/app-release.apk
                      artifacts/windows-release/Release.zip
                      artifacts/linux-release/release.tar.gz
                      artifacts/macos-release/macos-release.zip
                      artifacts/ios-release/ios-release.zip
                  draft: false
                  prerelease: false

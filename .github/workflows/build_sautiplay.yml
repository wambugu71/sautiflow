name: Build Sautiplay Releases

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
      - alpha-experimental-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: ./sautiplay
        run: flutter pub get

      - name: Generate Splash & Launcher Icons
        working-directory: ./sautiplay
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build Android APK
        working-directory: ./sautiplay
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi --dart-define="STREAM_URL_1=${{ secrets.STREAM_URL_1 }}" --dart-define="STREAM_URL_2=${{ secrets.STREAM_URL_2 }}"
      
      - name: Upload Artifact ARMv7
        uses: actions/upload-artifact@v4
        with:
          name: sautiflow_android_armv7
          path: sautiplay/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload Artifact ARM64
        uses: actions/upload-artifact@v4
        with:
          name: sautiflow_android_arm64
          path: sautiplay/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: .\sautiplay
        run: flutter pub get

      - name: Generate Splash & Launcher Icons
        working-directory: .\sautiplay
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build Windows
        working-directory: .\sautiplay
        run: flutter build windows --release --dart-define="STREAM_URL_1=${{ secrets.STREAM_URL_1 }}" --dart-define="STREAM_URL_2=${{ secrets.STREAM_URL_2 }}"

      - name: Compress Release
        working-directory: .\sautiplay\build\windows\x64\runner
        run: Compress-Archive -Path Release -DestinationPath Release.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sautiflow_windows
          path: sautiplay\build\windows\x64\runner\Release.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: ./sautiplay
        run: flutter pub get

      - name: Generate Splash & Launcher Icons
        working-directory: ./sautiplay
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build Linux
        working-directory: ./sautiplay
        run: flutter build linux --release --dart-define="STREAM_URL_1=${{ secrets.STREAM_URL_1 }}" --dart-define="STREAM_URL_2=${{ secrets.STREAM_URL_2 }}"

      - name: Compress Release
        working-directory: ./sautiplay/build/linux/x64/release
        run: tar -czvf release.tar.gz bundle

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sautiflow_linux
          path: sautiplay/build/linux/x64/release/release.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: ./sautiplay
        run: flutter pub get

      - name: Generate Splash & Launcher Icons
        working-directory: ./sautiplay
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build macOS
        working-directory: ./sautiplay
        run: flutter build macos --release --dart-define="STREAM_URL_1=${{ secrets.STREAM_URL_1 }}" --dart-define="STREAM_URL_2=${{ secrets.STREAM_URL_2 }}"

      - name: Compress Release
        working-directory: ./sautiplay/build/macos/Build/Products/Release
        run: zip -r macos-release.zip *.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sautiflow_macos
          path: sautiplay/build/macos/Build/Products/Release/macos-release.zip

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: ./sautiplay
        run: flutter pub get

      - name: Generate Splash & Launcher Icons
        working-directory: ./sautiplay
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build iOS
        working-directory: ./sautiplay
        run: flutter build ios --release --no-codesign --dart-define="STREAM_URL_1=${{ secrets.STREAM_URL_1 }}" --dart-define="STREAM_URL_2=${{ secrets.STREAM_URL_2 }}"

      - name: Compress Release
        working-directory: ./sautiplay/build/ios/iphoneos
        run: zip -r ios-release.zip Runner.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sautiflow_ios
          path: sautiplay/build/ios/iphoneos/ios-release.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/sautiflow_android_armv7/app-armeabi-v7a-release.apk
            artifacts/sautiflow_android_arm64/app-arm64-v8a-release.apk
            artifacts/sautiflow_windows/Release.zip
            artifacts/sautiflow_linux/release.tar.gz
            artifacts/sautiflow_macos/macos-release.zip
            artifacts/sautiflow_ios/ios-release.zip
          draft: false
          prerelease: false




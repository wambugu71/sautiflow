name: sautiplay
description: "Audio Player for audiophiles"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.6.15

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sautiflow:
    path: ../
  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  fl_chart: ^1.2.0

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  path: ^1.9.1
  dart_ytmusic_api: ^1.3.7
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  youtube_explode_dart: ^3.1.0
  flutter_lyric: ^3.0.2
  shimmer: ^3.0.0
  loading_indicator_m3e: ^0.1.1
  file_selector: ^1.1.0
  audio_metadata_reader: ^1.6.0
  text_scroll: ^0.2.1
  marquee: ^2.2.1
  share_plus: ^10.1.4

  # Desktop Media Controls & Notifications
  smtc_windows: ^1.1.0
  system_tray: ^2.0.3
  local_notifier: ^0.1.6

dependency_overrides:
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  msix: ^3.17.0
  flutter_to_debian: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter_native_splash:
  # This package generates native code to customize Flutter's default white native splash screen
  # with background color and splash image.

  # general color for all platform (except android 12+):
  color: "#101922" ##====================================[REQUIRED]==========

  # general image for all platform (except android 12+):
  image: assets/icon/splash.png

  # hide notif bar on android. ios already hides it by default.
  fullscreen: true

  #! ANDROID 12+ configuration:
  android_12:
    # background color
    color: "#101922"

    # center-logo
    image: assets/icon/splash.png

    # center-logo background color
    icon_background_color: "#101922"

msix_config:
  display_name: Sautiplay
  publisher_display_name: Sautiplay
  identity_name: sautiplay.app
  logo_path: assets/icon/splash.png

flutter_to_debian:
  bundle_name: sautiplay
  categories:
    - AudioVideo
    - Audio
    - Player
  maintainer: Sautiplay

name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get
      - name: update  pakages
        run: flutter pub upgrade -v

      - name: Generate Icons & Splash (if applicable)
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build APKs
        run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64 --split-per-abi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Artifact arm64
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload Artifact armv7
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Icons & Splash (if applicable)
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows Release
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath windows-release.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  create-release:
    needs: [build-android, build-windows]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk-arm64/app-arm64-v8a-release.apk
            android-apk-armv7/app-armeabi-v7a-release.apk
            windows-release/windows-release.zip
          generate_release_notes: true

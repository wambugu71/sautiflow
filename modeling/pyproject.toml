[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsp_modeling"
version = "1.0.0"
description = "Mathematical DSP modeling library for SautiFlow / MiniAudioDart audio engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "nbformat>=5.9.0",
    "pytest>=7.0.0",
]
